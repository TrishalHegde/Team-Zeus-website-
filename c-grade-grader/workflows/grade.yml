name: C/DSA Assignment Grader

on:
  push:
    branches:
      - main

jobs:
  grade:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout student code
        uses: actions/checkout@v4

      - name: Setup Python, GCC & Valgrind
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc valgrind python3

      - name: Fetch grading runner from Team Zeus repo
        run: |
          curl -sS -o grade.py \
            https://raw.githubusercontent.com/TrishalHegde/Team-Zeus-website-/main/c-grade-grader/grade.py

      - name: Register submission with backend (create queued record)
        id: register
        env:
          API_URL: ${{ secrets.API_URL }}
          STUDENT_JWT: ${{ secrets.STUDENT_JWT }}
          ASSIGNMENT_ID: ${{ secrets.ASSIGNMENT_ID }}
        run: |
          RESPONSE=$(curl -s -X POST "$API_URL/api/students/submit" \
            -H "Authorization: Bearer $STUDENT_JWT" \
            -H "Content-Type: application/json" \
            -d "{\"assignment_id\": \"$ASSIGNMENT_ID\", \"commit_hash\": \"$GITHUB_SHA\"}")
          echo "API Response: $RESPONSE"
          SUBMISSION_ID=$(echo "$RESPONSE" | python3 -c "import sys, json; print(json.load(sys.stdin)['submission_id'])")
          echo "SUBMISSION_ID=$SUBMISSION_ID" >> $GITHUB_ENV
          echo "Registered submission: $SUBMISSION_ID"

      - name: Execute Grade Runner
        env:
          SUBMISSION_ID: ${{ env.SUBMISSION_ID }}
          COMMIT_HASH: ${{ github.sha }}
          API_URL: ${{ secrets.API_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          python3 grade.py
